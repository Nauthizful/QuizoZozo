<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizoZozo - Créateur de Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .builder-layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 950px) {
      .builder-layout {
        grid-template-columns: 1fr;
      }
    }
    .question-list-scroll {
      max-height: 650px;
      overflow-y: auto;
      padding-right: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .question-card-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-glass-strong);
      border-radius: var(--radius-btn);
      padding: 1.2rem;
      display: flex;
      gap: 1rem;
      transition: all 0.2s ease;
    }
    .question-card-item:hover {
      border-color: #8B5CF6;
      background: rgba(15, 23, 42, 0.85);
    }
    .choice-input-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .choice-checkbox-label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 700;
      min-width: 55px;
    }
    .choice-checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #8B5CF6;
    }
    .image-preview-box {
      width: 100%;
      height: 140px;
      border: 2px dashed var(--border-glass-strong);
      border-radius: var(--radius-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      background: rgba(0,0,0,0.2);
      transition: border-color 0.2s ease;
    }
    .image-preview-box:hover {
      border-color: #8B5CF6;
    }
    .image-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-preview-box .upload-prompt {
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>
<body data-theme="quizz-moderne">

  <div class="app-container" style="max-width: 1450px;">
    <!-- Header -->
    <header class="app-header">
      <div class="flex-row items-center gap-4">
        <div class="brand-logo">✏️ QUIZOZOZO BUILDER</div>
        <span id="builder-count-badge" class="badge badge-info">0 question(s)</span>
      </div>

      <div class="flex-row items-center gap-2" style="flex-wrap: wrap;">
        <!-- Export Group -->
        <button id="btn-export-json" class="btn btn-secondary btn-sm" title="Télécharger le fichier JSON (texte uniquement)">📄 Exporter JSON</button>
        <button id="btn-export-zip" class="btn btn-primary btn-sm" title="Télécharger le package ZIP complet avec les images intégrées">📦 Exporter ZIP (Complet)</button>

        <!-- Import Group -->
        <button id="btn-import-json-trigger" class="btn btn-secondary btn-sm" title="Importer un fichier JSON de questions">📥 Importer JSON</button>
        <input type="file" id="import-json-input" accept=".json" style="display: none;">

        <button id="btn-import-zip-trigger" class="btn btn-secondary btn-sm" title="Importer un package ZIP complet (questions + images)">📦 Importer ZIP</button>
        <input type="file" id="import-zip-input" accept=".zip" style="display: none;">

        <button id="btn-load-sample" class="btn btn-secondary btn-sm">✨ Exemple</button>
        <a href="/admin" class="btn btn-success btn-sm">🎙️ Régie ↗</a>
      </div>
    </header>

    <!-- MAIN BUILDER LAYOUT -->
    <div class="builder-layout">

      <!-- LEFT: QUESTION FORM -->
      <section class="glass-card">
        <div class="glass-card-header">
          <h2 id="form-card-title" style="font-size: 1.25rem;">➕ Ajouter une question</h2>
          <button id="btn-cancel-edit" class="btn btn-secondary btn-sm hidden">Annuler modif</button>
        </div>

        <form id="question-form">
          <!-- Quiz Title & Theme Selectors in a Grid -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
            <div>
              <label class="form-label" for="quiz-title-input">Titre du QuizoZozo :</label>
              <input type="text" id="quiz-title-input" class="form-control" value="QuizoZozo en Direct !" required>
            </div>

            <div>
              <label class="form-label" for="quiz-theme-select">🎨 Thème visuel (User & Display) :</label>
              <select id="quiz-theme-select" class="form-control" style="font-weight: 700; color: #38BDF8;">
                <option value="quizz-moderne" selected>🟣 Quizz Moderne (Kahoot Neon)</option>
                <option value="geek-it">💻 Geek / IT (Terminal Hacker CRT)</option>
                <option value="mariage-automne">🍂 Mariage Automnal / Whimsical (Terracotta & Or)</option>
                <option value="windows-xp">🪟 Windows XP (Colline Bliss & Luna)</option>
                <option value="synthwave-arcade">🕹️ Synthwave Arcade 80s (Néon Laser)</option>
                <option value="eclipse-etoiles">✨ Éclipse Solaire & Étoiles Filantes (Cosmique Doré)</option>
              </select>
            </div>
          </div>

          <!-- Question Prompt -->
          <div class="form-group">
            <label class="form-label" for="question-prompt-input">Énoncé de la question :</label>
            <textarea id="question-prompt-input" class="form-control" rows="2" placeholder="Ex: Quels animaux sont des mammifères marins ?" required></textarea>
          </div>

          <!-- Number of Choices Selector (3 to 6) -->
          <div class="form-group">
            <label class="form-label" for="choices-count-select">Nombre de choix de réponses :</label>
            <select id="choices-count-select" class="form-control">
              <option value="3">3 choix (A, B, C)</option>
              <option value="4" selected>4 choix (A, B, C, D)</option>
              <option value="5">5 choix (A, B, C, D, E)</option>
              <option value="6">6 choix (A, B, C, D, E, F)</option>
            </select>
          </div>

          <!-- Image Upload Box -->
          <div class="form-group">
            <label class="form-label">Image d'illustration (optionnelle) :</label>
            <div class="image-preview-box" id="image-drop-area">
              <div id="upload-placeholder" class="upload-prompt">
                📷 Cliquez ou glissez une image ici (PNG, JPG, WEBP)
              </div>
              <img id="image-preview" class="hidden" alt="Aperçu image">
            </div>
            <input type="file" id="image-file-input" accept="image/*" style="display: none;">
            <div class="flex-row justify-between items-center mt-2">
              <span id="image-upload-status" style="font-size: 0.8rem; color: var(--text-muted);">Aucune image sélectionnée</span>
              <button type="button" id="btn-remove-image" class="btn btn-secondary btn-sm hidden" style="color: #F87171;">Supprimer l'image</button>
            </div>
          </div>

          <!-- Dynamic Choices & Checkboxes for Multiple Correct Answers -->
          <div class="form-group">
            <div class="flex-row justify-between items-center mb-2">
              <label class="form-label" style="margin-bottom: 0;">Choix de réponses :</label>
              <span style="font-size: 0.8rem; color: #38BDF8;">☑️ Cochez la ou les bonnes réponses</span>
            </div>
            
            <!-- Choice A -->
            <div class="choice-input-row" id="row-choice-a">
              <label class="choice-checkbox-label" style="color: var(--color-red);">
                <input type="checkbox" name="correctChoices" value="A"> ▲ A
              </label>
              <input type="text" id="choice-input-a" class="form-control" placeholder="Texte du choix A..." required>
            </div>

            <!-- Choice B -->
            <div class="choice-input-row" id="row-choice-b">
              <label class="choice-checkbox-label" style="color: var(--color-blue);">
                <input type="checkbox" name="correctChoices" value="B"> ◆ B
              </label>
              <input type="text" id="choice-input-b" class="form-control" placeholder="Texte du choix B..." required>
            </div>

            <!-- Choice C -->
            <div class="choice-input-row" id="row-choice-c">
              <label class="choice-checkbox-label" style="color: var(--color-yellow);">
                <input type="checkbox" name="correctChoices" value="C"> ● C
              </label>
              <input type="text" id="choice-input-c" class="form-control" placeholder="Texte du choix C..." required>
            </div>

            <!-- Choice D -->
            <div class="choice-input-row" id="row-choice-d">
              <label class="choice-checkbox-label" style="color: var(--color-green);">
                <input type="checkbox" name="correctChoices" value="D"> ■ D
              </label>
              <input type="text" id="choice-input-d" class="form-control" placeholder="Texte du choix D...">
            </div>

            <!-- Choice E -->
            <div class="choice-input-row hidden" id="row-choice-e">
              <label class="choice-checkbox-label" style="color: var(--color-purple);">
                <input type="checkbox" name="correctChoices" value="E"> ★ E
              </label>
              <input type="text" id="choice-input-e" class="form-control" placeholder="Texte du choix E...">
            </div>

            <!-- Choice F -->
            <div class="choice-input-row hidden" id="row-choice-f">
              <label class="choice-checkbox-label" style="color: var(--color-cyan);">
                <input type="checkbox" name="correctChoices" value="F"> ✦ F
              </label>
              <input type="text" id="choice-input-f" class="form-control" placeholder="Texte du choix F...">
            </div>
          </div>

          <!-- Timer Selector -->
          <div class="form-group">
            <label class="form-label" for="question-timer-select">Durée du chronomètre :</label>
            <select id="question-timer-select" class="form-control">
              <option value="5">5 secondes (Éclair)</option>
              <option value="10">10 secondes (Rapide)</option>
              <option value="15">15 secondes</option>
              <option value="20" selected>20 secondes (Standard)</option>
              <option value="25">25 secondes</option>
              <option value="30">30 secondes (Réflexion)</option>
              <option value="60">60 secondes (Long)</option>
            </select>
          </div>

          <!-- Optional: Host Note -->
          <div class="form-group">
            <label class="form-label" for="question-note-input">Note d'animation / Blague (pour l'animateur) :</label>
            <input type="text" id="question-note-input" class="form-control" placeholder="Ex: Anecdote rigolote à lire pendant la révélation...">
          </div>

          <!-- Optional: Hint -->
          <div class="form-group">
            <label class="form-label" for="question-hint-input">Indice pour le public (optionnel) :</label>
            <input type="text" id="question-hint-input" class="form-control" placeholder="Ex: Il y a 3 mammifères marins à trouver...">
          </div>

          <!-- Form Buttons -->
          <div class="flex-row gap-3 mt-4">
            <button type="submit" id="btn-save-question" class="btn btn-primary flex-1">
              ➕ Ajouter au Quiz
            </button>
            <button type="button" id="btn-save-all-server" class="btn btn-success">
              💾 Enregistrer Tout
            </button>
          </div>
        </form>
      </section>

      <!-- RIGHT: QUESTIONS LIST & REORDERING -->
      <section class="glass-card flex-col">
        <div class="glass-card-header">
          <div class="flex-row items-center gap-2">
            <h2 style="font-size: 1.25rem;">📋 Questions du Quiz</h2>
            <span id="list-counter" class="badge badge-warning">0</span>
          </div>
          <span style="font-size: 0.85rem; color: var(--text-secondary);">Organisez l'ordre</span>
        </div>

        <div id="questions-container" class="question-list-scroll">
          <p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Aucune question pour le moment.</p>
        </div>
      </section>

    </div>
  </div>

  <script src="/js/builder.js"></script>
</body>
</html>
